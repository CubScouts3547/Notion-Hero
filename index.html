<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notion Hero</title>
    <style>
      :root {
        --hero-height: 360px;
        --overlay: 0.55; /* increase (0.65–0.75) to darken more */
      }

      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      .hero {
        position: relative;
        height: var(--hero-height);
        border-radius: 16px;
        overflow: hidden;
        display: grid;
        place-items: center; /* centers the text */
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,var(--overlay));
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        padding: 0 48px;

        color: #fff;
        text-align: center;

        font-size: clamp(28px, 4.2vw, 56px);
        line-height: 1.08;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 18px rgba(0,0,0,0.35);

        max-width: 34ch;      /* controls how wide the 2 lines are */
        margin-inline: auto;  /* centers the text block */
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <!-- Use a relative path if the image is in the same repo (recommended),
           or replace with your working full GitHub Pages image URL -->
      <img src="Screenshot-2024-07-17-at-8.16.png" alt="">
