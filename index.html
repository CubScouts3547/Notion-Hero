<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notion Hero</title>
    <style>
      :root {
        --hero-height: 320px;
        --overlay: 0.55; /* 0 = no darkening, 1 = fully black */
      }

      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      .hero {
        position: relative;
        height: var(--hero-height);
        border-radius: 16px;
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.02);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,var(--overlay));
      }

      .content {
        position: relative;
        z-index: 1;
        width: min(900px, 92%);
        color: #fff;
        text-align: left;
      }

      h1 {
        margin: 0 0 10px 0;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        font-size: clamp(14px, 2vw, 18px);
        opacity: 0.92;
        max-width: 60ch;
      }

      .pill {
        display: inline-block;
        margin-bottom: 14px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
        backdrop-filter: blur(6px);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <!-- Change this image URL -->
      <img src="Screenshot-2024-07-17-at-8.16.png" alt="">
      <div class="content">
        <span class="pill">Double Zero</span>
        <h1>Your headline goes here</h1>
        <p>Short supporting line here. This is real overlay text on top of the image.</p>
      </div>
    </div>
  </body>
</html>
