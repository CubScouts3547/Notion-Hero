<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notion Hero</title>
    <style>
      :root {
        --hero-height: 360px;
        --overlay: 0.55; /* increase (0.65–0.75) to darken more */
      }

      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      .hero {
        position: relative;
        height: var(--hero-height);

        border-radius: 0;   /* HARD corners */
        overflow: hidden;

        display: flex;      /* reliable centering */
        align-items: center;
        justify-content: center;
      }

      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,var(--overlay));
      }

      h1 {
        position: relative;
        z-index: 1;

        /* Center the text block */
        width: 100%;
        margin: 0;
        padding: 0 48px;
        box-sizing: border-box;

        color: #fff;
        text-align: center;

        font-size: clamp(28px, 4.2vw, 56px);
        line-height: 1.08;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 18px rgba(0,0,0,0.35);

        /* Keep it to a nice two-line measure */
        max-width: 1100px;
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <img src="Screenshot-2024-07-17-at-8.16.png" alt="">

      <h1>
       Discover Adventure<br> 
        with Cub Scouts
        
      </h1>
    </div>
  </body>
</html>
